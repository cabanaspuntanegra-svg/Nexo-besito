<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Nexo Besito — voz + vibración</title>
<style>
  :root { color-scheme: dark; font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#111318; color:#f4f5f7; }
  main { width:min(92vw,520px); padding:28px; border-radius:24px; background:#1b1f27; box-shadow:0 20px 60px #0008; }
  h1 { margin:0 0 8px; font-size:28px; }
  p { line-height:1.45; color:#c9ced8; }
  button { width:100%; padding:16px 18px; margin-top:12px; border:0; border-radius:16px; font-size:18px; font-weight:700; cursor:pointer; }
  #listen { background:#f3f4f6; color:#111318; }
  #test { background:#2b313c; color:#fff; }
  #status { margin-top:18px; padding:14px; border-radius:14px; background:#12151b; min-height:44px; }
  .small { font-size:14px; color:#9ca5b5; }
</style>
</head>
<body>
<main>
  <h1>Nexo Besito</h1>
  <p>Prueba local de voz → respuesta → vibración.</p>
  <button id="listen">Activar escucha</button>
  <button id="test">Probar vibración</button>
  <div id="status">Esperando activación…</div>
  <p class="small">Decí: “Katia, dame un besito”. Permití el micrófono si Chrome lo solicita.</p>
</main>
<script>
const statusEl = document.getElementById('status');
const listenBtn = document.getElementById('listen');
const testBtn = document.getElementById('test');

function normalize(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9ñ\s]/g,' ').replace(/\s+/g,' ').trim();
}
function doKiss() {
  statusEl.textContent = "Besito enviado 💛";
  if ('vibrate' in navigator) navigator.vibrate([90,70,150,80,260]);
  const u = new SpeechSynthesisUtterance("Ahí va tu besito.");
  u.lang = "es-UY";
  u.rate = 0.96;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
testBtn.onclick = doKiss;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, running = false;

if (!SR) {
  listenBtn.disabled = true;
  listenBtn.textContent = "Voz no disponible en este navegador";
  statusEl.textContent = "Podés probar la vibración con el botón.";
} else {
  rec = new SR();
  rec.lang = "es-UY";
  rec.continuous = true;
  rec.interimResults = false;

  rec.onstart = () => {
    running = true;
    listenBtn.textContent = "Detener escucha";
    statusEl.textContent = 'Escuchando… decí: “Katia, dame un besito”';
  };
  rec.onend = () => {
    running = false;
    listenBtn.textContent = "Activar escucha";
  };
  rec.onerror = (e) => {
    statusEl.textContent = "Error de voz: " + e.error;
  };
  rec.onresult = (event) => {
    const raw = event.results[event.results.length - 1][0].transcript;
    const t = normalize(raw);
    statusEl.textContent = 'Oí: “' + raw + '”';
    if (t.includes("katia") && (t.includes("besito") || t.includes("beso"))) {
      setTimeout(doKiss, 180);
    }
  };
  listenBtn.onclick = () => {
    if (running) rec.stop();
    else {
      try { rec.start(); }
      catch(e) { statusEl.textContent = "Tocá de nuevo para iniciar la escucha."; }
    }
  };
}
</script>
</body>
</html>
